<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#03050B" />
  <meta name="description" content="Awakening: transforme hábitos, estudos e treinos em missões e evolua do Rank E ao MONARCA." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Awakening" />
  <title>Awakening</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <script>
    /* aplica modo claro/escuro e animações antes do primeiro desenho, para não piscar */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('awakening-settings-v1') || '{}'), el = document.documentElement;
        var light = s.mode === 'light' || (s.mode === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
        el.setAttribute('data-mode', light ? 'light' : 'dark'); el.setAttribute('data-motion', s.motion === 'reduced' ? 'reduced' : 'auto');
        if (light) { var m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', '#EAF0FA'); }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="scan"></div><div id="dots"></div></div>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal"></div>
  <script src="domain.js"></script>
  <script src="rankfx.js"></script>
  <script src="app.js"></script>
  <script src="features.js"></script>
  <script src="treinos.js"></script>
  <script src="workout.js"></script>
</body>
</html>
